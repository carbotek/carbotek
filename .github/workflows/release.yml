name: Release

# Push a stable or prerelease tag (vX.Y.Z, vX.Y.Z-rc.N or vX.Y.ZrcN) to build the Linux abi3 wheels
# (CPython 3.15+), the pure wheel and the sdist with that version, publish them to PyPI through
# trusted publishing, and attach them to a GitHub release.
# workflow_dispatch builds everything without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      # The tag is the source of truth, as with hatch-vcs: v1.2.3 -> 1.2.3. A manual run keeps the
      # version from native/Cargo.toml.
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python tools/release_version.py "$GITHUB_REF_NAME")
          else
            version=$(python tools/release_version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@v5
      - name: Set version
        shell: bash
        run: python tools/release_version.py "${{ needs.check.outputs.version }}" --write-cargo
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.15
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version
        shell: bash
        run: python tools/release_version.py "${{ needs.check.outputs.version }}" --write-cargo
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist

  pure:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - name: Set version
        shell: bash
        run: python tools/release_version.py "${{ needs.check.outputs.version }}" --write-cargo
      - run: uv run --no-project --with build --with setuptools --with wheel python tools/build_pure_wheel.py --out dist
      - run: uv venv pure-check
      - run: uv pip install --python pure-check/bin/python dist/*-py3-none-any.whl pytest
      - run: pure-check/bin/python -c "import carbotek; from carbotek._native_adapter import native_available; assert not native_available()"
      - run: pure-check/bin/python -m pytest -q tests -p no:cacheprovider
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-pure
          path: dist/*-py3-none-any.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, linux, sdist, pure]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/carbotek/
    permissions:
      id-token: write   # trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
