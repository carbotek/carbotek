[package]
name = "carbotek-native"
version = "0.1.0"
edition = "2024"
# edition 2024 needs 1.85, unsigned is_multiple_of 1.87.
rust-version = "1.87"
description = "Optional native accelerators of carbotek (carbotek._native)"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# No extension-module feature: maturin sets PYO3_BUILD_EXTENSION_MODULE for wheels, and cargo test
# can still link against libpython.
pyo3 = "0.29"
base64 = "0.23"
# Shortest round-trip digits with ties to even, as JS and Python repr print them.
ryu = "1"
# Patched copy of dxpdf 0.8.1 (DOCX to PDF), see vendor/dxpdf/CARBOTEK.md. The python feature of
# dxpdf is not used: carbotek exposes its own convert_pdf.
dxpdf = { path = "vendor/dxpdf", default-features = false, features = ["subset-fonts"], optional = true }

[features]
pdf = ["dep:dxpdf"]

# dxpdf builds with a patched quick-xml (vendor/quick-xml-0.41.0/PATCH.md); a [patch] in a
# dependency's manifest is ignored, so it is repeated here.
[patch.crates-io]
quick-xml = { path = "vendor/quick-xml-0.41.0" }
